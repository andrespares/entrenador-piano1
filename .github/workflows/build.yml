name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Instalar dependencias de Linux
      run: |
        sudo apt update
        sudo apt install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
          libsdl2-ttf-dev libsdl2-mixer-dev libportmidi-dev libswscale-dev \
          libavformat-dev libavcodec-dev zlib1g-dev unzip autoconf libtool pkg-config
        pip install --user --upgrade buildozer docutils Cython

    - name: Compilar APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: EntrenadorPiano-APK
        path: bin/*.apk*.apk
